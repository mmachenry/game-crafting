      function change (name) {
        current[name] = current[name]+1
        if (current[name] >= images[name].length) {
            current[name] = 0
        }
        show(name)
      }

      function show (name) {  
        document.getElementById(name).src = images[name][current[name]]
      }

      function showInit () {
        ["ant","spider","grasshopper","beetle","bee","ladybug","mosquito","pillbug"]
        .forEach((name) => {
          current[name] = 0
          show(name)
        })
      }

    </script>

  <body onload="showInit()">
    <div>
      <img id="ant" width="200em" src="" onclick="change('ant')"/>
